syntax = "proto3";

package wink.partner.v1;

option java_package = "travel.wink.grpc.v1";
option java_multiple_files = true;
option java_outer_classname = "PartnerCommonProto";

// MAINTAINER NOTES — NOT PUBLISHED.
//
// Separated from the next declaration by a BLANK LINE so protoc classifies this block as
// `leading_detached_comments`, which GrpcOpenApiGenerator never reads. See partner_destination_lookup.proto
// for the full explanation of that split.
//
// WHY THIS FILE EXISTS. proto3 scopes message and enum names to the PACKAGE, not the file. Every Partner
// surface shares `package wink.partner.v1`, so two files cannot each declare a `LifestyleType`. Search and
// Inventory both need the types Media already had, so the shared ones live here and every Partner file
// imports them.
//
// `LifestyleType` MOVED HERE FROM partner_media.proto. That move is safe on both axes and neither is
// obvious, so both are written down:
//   * WIRE: a type's identity is its fully-qualified name, `wink.partner.v1.LifestyleType`. The package is
//     unchanged, so encoded bytes, JSON names and descriptor lookups are all identical. Which .proto FILE
//     declares it is not part of the contract.
//   * JAVA: with `java_multiple_files = true` every message/enum becomes its own top-level class in
//     `java_package`. Both files declare `travel.wink.grpc.v1`, so the generated class keeps its exact FQN.
//     The `*Proto` outer class holds only the FILE descriptor, not the types.
// The one real consequence is descriptor enumeration: code walking
// `PartnerMediaProto.getDescriptor().getEnumTypes()` no longer sees LifestyleType — it is on
// PartnerCommonProto now. Check GrpcOpenApiGeneratorTest and PartnerRequestConventionTest when moving types.
//
// SCOPE RULE: put a type here only when a SECOND surface needs it. A type used by one surface belongs in
// that surface's file, where its comments sit next to the RPCs that return it. This file is not a dumping
// ground for "generic-looking" messages.

// A single position on the globe: latitude and longitude, and nothing else.
//
// Named fields rather than a GeoJSON-style `[longitude, latitude]` array or `{type, coordinates}` object,
// for two reasons that hold whether this is a request or a response field:
//
//   * proto3 has no ragged arrays, so a ring of positions cannot be a bare `repeated double` without
//     client and server silently disagreeing about where one vertex ends and the next begins.
//   * GeoJSON's array order is longitude-first, the reverse of the `lat,lng` ordering most mapping UIs
//     use -- a reversal that does not error, it just returns confident results from the wrong hemisphere.
//     Naming the fields makes that mistake unrepresentable.
//
// USED ON BOTH SIDES OF THE WIRE. `GeoShape.point` and every polygon vertex use it on requests;
// `PropertySearchResult.geo_location`, `PropertyBasics.geo_location` and `InventoryItemContent.geo_location`
// use it on responses. There used to be a separate `GeoPoint` message for responses, carrying a `type`
// string so the value round-tripped as valid GeoJSON. It is gone: every caller that needed only the
// coordinates paid for a field that was always the literal string `"Point"`, and a caller that wanted real
// GeoJSON to hand to a map library can wrap {@code {longitude, latitude}} in one line locally. If a genuine
// GeoJSON round-trip need reappears, reintroduce a dedicated type for it rather than growing this one --
// see the SCOPE RULE at the top of this file.
message GeoPosition {

  // Degrees east of the prime meridian, -180 to 180.
  double longitude = 1;

  // Degrees north of the equator, -90 to 90.
  double latitude = 2;
}

// One closed ring of a polygon.
//
// The first and last position MUST be identical — that is what closes the ring, and Mongo rejects an
// unclosed one at query time. A ring needs at least four positions, since a triangle repeats its first
// vertex to close.
message GeoRing {

  // Vertices in order, first repeated last to close the ring.
  repeated GeoPosition positions = 1;
}

// A polygon: one outer ring, plus a hole for each additional ring.
//
// GeoJSON winding applies — the outer ring counter-clockwise, holes clockwise. A ring wound the wrong way
// describes the complement of what you meant, which on a sphere is most of the planet, so a viewport
// wound backwards matches nearly every property rather than none.
message GeoPolygon {

  // Outer ring first. Every ring after it is a hole punched out of that outer ring.
  repeated GeoRing rings = 1;
}

// Several disjoint polygons treated as one search area.
message GeoMultiPolygon {

  // The polygons. Each is independent; a property inside any one of them matches.
  repeated GeoPolygon polygons = 1;
}

// A search area: a point, a polygon, or several polygons.
//
// Exactly one member is set, and the field you choose IS the geometry type — there is no separate `type`
// string to keep in sync with the coordinates, and no way to describe a Point while supplying a ring.
//
// The point here is a GeoPosition -- bare latitude and longitude -- rather than a message carrying its own
// `type` string. Inside this oneof the field name already settles the geometry type, so a `type` string
// would be a second and weaker statement of what the case already guarantees, and it would serialize as
// `"type": ""` whenever a caller sensibly left it out, which reads like a defect.
//
// The three are not interchangeable ways of saying the same thing. A `point` is a proximity search: it
// takes a radius, and results come back nearest first. A `polygon` or `multi_polygon` is a containment
// search: a property is inside the area or it is not, there is no radius, and there is no distance to
// order by. Choose by which question you are asking, not by which shape is easier to build.
message GeoShape {

  oneof geometry {

    // Search outward from this point, out to `radius_in_meters`.
    GeoPosition point = 1;

    // Search inside this polygon.
    GeoPolygon polygon = 2;

    // Search inside any of these polygons.
    GeoMultiPolygon multi_polygon = 3;
  }
}

// The city a property is in, as a GeoNames record.
//
// This is the JOIN between a property and the destination surfaces. `geo_name_id` is what
// Search.SearchByCity takes; `url_name` is what Search.RankByCity and Lookup take. Carrying both means a
// caller holding a property can ask "what else is in this city" without a lookup round trip first.
//
// Distinct from `Address.city`, which is the city NAME the property typed into its address and is free
// text. This is the resolved GeoNames record, and only this one has identifiers you can call back with.
//
// The whole message is absent when the property has no city on record. That is rare but real -- 17 of
// 3,230 production properties, 13 of them live inventory -- so treat it as optional rather than assuming
// every property resolves to a city.
message City {

  // GeoNames id, e.g. "1609350" for Bangkok. Pass to Search.SearchByCity.
  //
  // Always set when this message is present: every property that has a city has this.
  string geo_name_id = 1;

  // The city's name.
  //
  // NOT localized, unlike every other name on this surface. The lightweight GeoNames record this comes
  // from deliberately excludes alternate-name translations, so this is the canonical GeoNames name
  // whatever `language_code` you asked for. Said plainly because a caller would otherwise reasonably
  // assume it follows the rest of the response.
  string name = 2;

  // Url-safe slug. Pass to Search.RankByCity, which takes the url name rather than the GeoNames id.
  //
  // EMPTY for a substantial minority of properties -- 601 of 3,230 in production, about 19% -- because the
  // slug is populated separately from the GeoNames link. Check it before building a RankByCity call; an
  // empty value here does not mean the property has no city, only that this particular handle is missing.
  string url_name = 3;

  // ISO 3166-1 alpha-2 country code of the city, e.g. "TH".
  string country_code = 4;
}

// A postal address.
message Address {

  // Street line 1.
  string address1 = 1;

  // Street line 2, when the property supplies one.
  string address2 = 2;

  // State, province or region.
  string state = 3;

  // Postal or ZIP code.
  string postal_code = 4;

  // City name.
  string city = 5;

  // ISO 3166-1 alpha-2 country code, e.g. "TH".
  string country_code = 6;

  // Country name in the requested language.
  string country = 7;

  // The full address pre-formatted for display, newline-free.
  string full_address = 8;
}

// A short piece of localized text.
//
// The API returns descriptions already filtered to the language on your request, so you will normally see
// exactly one entry per collection. `language_code` is still present so you can tell which language you got when
// the requested one was unavailable and the property's default was substituted.
message Description {

  // Short label for this description.
  string name = 1;

  // The description body.
  string description = 2;

  // ISO 639-1 language code of `name` and `description`.
  string language_code = 3;
}

// One published image or video.
//
// Key anything you cache on `media_id`. It is stable for the life of the asset; URLs are not — they
// carry transformation and delivery parameters that change without notice.
message Multimedia {

  // Stable identifier for this asset. Use this as your cache key.
  string media_id = 1;

  // Identifier of the inventory item this asset belongs to (the property, a guest room, and so on).
  // Named `entity_id` rather than `identifier` to match the `*_id` convention the rest of this surface
  // uses, and because "identifier" said nothing about WHOSE identifier it is.
  string entity_id = 2;

  // MEDIA_TYPE_IMAGE or MEDIA_TYPE_VIDEO.
  MultimediaKind kind = 3;

  // Where the asset came from, e.g. the property's own upload or a syndicated source.
  string source = 4;

  // Display order within its gallery, ascending.
  int32 sort = 5;

  // Camera angle or shot description, when the property supplied one.
  string angle = 6;

  // Intrinsic width in pixels.
  int32 width = 7;

  // Intrinsic height in pixels.
  int32 height = 8;

  // Localized captions.
  repeated Description descriptions = 9;

  // The lifestyle this asset is meant to illustrate, when tagged.
  LifestyleType lifestyle_type = 10;

  // Ready-to-use delivery URLs, one per variant. Which variants are populated depends on whether the
  // asset is an image, a Cloudinary video or an externally-hosted one — see MediaUrlSet.
  MediaUrlSet urls = 11;

  // OpenTravel PIC (Picture Category) code, e.g. "2" = Lobby view, "6" = Guest room. What the asset depicts,
  // which is what you want when laying out a gallery rather than dumping it in `sort` order. Empty when
  // the property never categorised the asset. Look codes up at https://wink.travel/developers/taxonomy.
  string ota_pic_category = 12;
}

// Ready-to-use delivery URLs for one asset, one field per variant.
//
// Which fields are populated depends on the asset. Images carry `original`, `large`, `medium` and
// `thumbnail`; Cloudinary videos carry `stream`, `preview`, `poster` and `thumbnail`; externally-hosted
// video (YouTube) carries only `external_url`, because Wink generates no variants for media it does not
// host. Always check the variant you want is present rather than assuming a fixed set.
//
// THESE URLS MAY ROTATE. Wink's media-reorganization migration rewrites the underlying storage id of
// every asset it touches, which changes every URL here. `Multimedia.media_id` does NOT change. Key your
// storage on `media_id` and re-sync when `PropertySearchResult.content_version` moves; treating a URL as a
// permanent identifier will break.
message MediaUrlSet {

  // MULTIMEDIA_KIND_IMAGE only: unscaled, best-quality delivery URL.
  MediaUrlVariant original = 1;

  // MULTIMEDIA_KIND_IMAGE only: large variant, max width 1920px.
  MediaUrlVariant large = 2;

  // MULTIMEDIA_KIND_IMAGE only: medium variant, max width 1024px.
  MediaUrlVariant medium = 3;

  // MULTIMEDIA_KIND_IMAGE or MULTIMEDIA_KIND_VIDEO (Cloudinary): thumbnail variant, max width 320px. For video
  // this is a still frame extracted from the video, so its `format` is an image type and follows
  // `image_format`, not `video_format`.
  MediaUrlVariant thumbnail = 4;

  // MULTIMEDIA_KIND_VIDEO (Cloudinary) only: streaming delivery URL, unscaled. Delivered as `video_format`,
  // which defaults to video/mp4.
  MediaUrlVariant stream = 5;

  // MULTIMEDIA_KIND_VIDEO (Cloudinary) only: preview variant, max width 1280px. Delivered as `video_format`.
  MediaUrlVariant preview = 6;

  // MULTIMEDIA_KIND_VIDEO (Cloudinary) only: poster frame at medium width. A still EXTRACTED from the video,
  // so like `thumbnail` it is an image and follows `image_format`.
  MediaUrlVariant poster = 7;

  // MULTIMEDIA_KIND_VIDEO (YouTube) only: pass-through to the YouTube watch URL. Wink generates no variants for
  // externally-hosted media, so no format applies and every MediaUrlVariant field above is unset.
  string external_url = 8;
}

// One delivery URL, what it is scaled to, and what it will actually return.
message MediaUrlVariant {

  // Ready-to-use delivery URL for this variant.
  string url = 1;

  // Maximum pixel width this variant is scaled to. Unset for variants with no resize (image
  // "original", video "stream") — explicit presence so "not resized" is distinguishable from a
  // literal 0px width.
  optional int32 max_width = 2;

  // The IANA media type this URL returns: one of image/jpeg, image/png, image/webp, image/* or video/mp4,
  // video/webm. Feed it straight to a Content-Type header or use it to pick a decoder.
  //
  // This ECHOES what was served, so it reflects the `image_format` and `video_format` you sent on the
  // request. Send neither and images are image/jpeg and video is video/mp4.
  //
  // image/* is the one value that is not a concrete type: it means the CDN negotiates per client from
  // the Accept header, so the same URL returns WebP, AVIF or JPEG to different callers. It is only ever
  // returned if you asked for it. Everything else is deterministic — the same URL returns the same bytes
  // to every client, which is what makes it safe to cache and re-serve.
  string format = 3;
}

// Whether a Media entry is a still image or a video.
enum MultimediaKind {

  // Not set.
  MULTIMEDIA_KIND_UNSPECIFIED = 0;

  // A still image.
  MULTIMEDIA_KIND_IMAGE = 1;

  // A video.
  MULTIMEDIA_KIND_VIDEO = 2;
}

// The traveller lifestyle a property, room or media asset is oriented toward.
//
// Values are additive: a property may carry several. Treat an unrecognized value as "some lifestyle this
// client does not know about yet" rather than an error — proto3 enums are open, and new lifestyles are
// added without a version bump.
enum LifestyleType {

  // Not set.
  LIFESTYLE_TYPE_UNSPECIFIED = 0;

  // Health and fitness focused.
  LIFESTYLE_TYPE_HEALTH_FITNESS = 1;

  // Relaxation focused.
  LIFESTYLE_TYPE_RELAX = 2;

  // Adults only.
  LIFESTYLE_TYPE_ADULT_ONLY = 3;

  // Adventure travel.
  LIFESTYLE_TYPE_ADVENTURE = 4;

  // Business travel.
  LIFESTYLE_TYPE_BUSINESS = 5;

  // LGBT focused.
  LIFESTYLE_TYPE_LGBT = 6;

  // Single parent travel.
  LIFESTYLE_TYPE_SINGLE_PARENT = 7;

  // Solo female travel.
  LIFESTYLE_TYPE_SOLO_FEMALE = 8;

  // Beauty and wellness.
  LIFESTYLE_TYPE_BEAUTY = 9;

  // Food and dining focused.
  LIFESTYLE_TYPE_FOODIE = 10;

  // Family travel.
  LIFESTYLE_TYPE_FAMILY = 11;

  // Romantic travel.
  LIFESTYLE_TYPE_ROMANCE = 12;

  // Couples travel.
  LIFESTYLE_TYPE_COUPLE = 13;

  // Solo travel.
  LIFESTYLE_TYPE_SOLO = 14;

  // Backpacking.
  LIFESTYLE_TYPE_BACKPACKER = 15;

  // Shopping focused.
  LIFESTYLE_TYPE_SHOPPING = 16;

  // Sports focused.
  LIFESTYLE_TYPE_SPORTS = 17;

  // Mountain destinations.
  LIFESTYLE_TYPE_MOUNTAIN = 18;

  // Beach destinations.
  LIFESTYLE_TYPE_BEACH = 19;

  // City destinations.
  LIFESTYLE_TYPE_CITY = 20;

  // Countryside destinations.
  LIFESTYLE_TYPE_COUNTRY = 21;

  // Culture and heritage.
  LIFESTYLE_TYPE_CULTURE = 22;

  // Eco and sustainable travel.
  LIFESTYLE_TYPE_ECO = 23;
}

// ---------------------------------------------------------------------------------------------------
// Pricing types, shared by Search and Inventory
//
// These live here rather than in partner_search.proto because Inventory needs them too, and a surface
// importing another surface's file just to reach a shared type is a dependency with no meaning: Inventory
// does not search for anything. A value used by more than one service belongs in common.
// ---------------------------------------------------------------------------------------------------

// Who is travelling, when, and in what currency and language.
//
// This drives pricing, not just presentation: `currency_code` selects the currency every Money on the response is
// converted into, and `itinerary` determines both availability and how the call is billed.
message UserSession {

  // Stay dates and occupancy. Required — searches without an itinerary cannot be priced.
  Itinerary itinerary = 1;

  // ISO 639-1 language, e.g. "en". Affects the little text this surface returns; for descriptions and other
  // prose, pass the language to the Content service instead. Defaults to "en".
  string language_code = 2;

  // ISO 4217 currency for all returned prices, e.g. "THB". Exactly three characters. Defaults to the
  // property's own currency.
  string currency_code = 3;

  // Promotional codes to apply. Codes your account is not entitled to are ignored, not rejected.
  repeated string promotional_codes = 4;
}

// Stay dates and occupancy.
message Itinerary {

  // Check-in date, ISO-8601 "YYYY-MM-DD". Required. Must be today or later -- a past date is rejected
  // with INVALID_ARGUMENT.
  string start_date = 1;

  // Number of nights. Billing caps this at 90; a longer stay is rejected with INVALID_ARGUMENT.
  int32 nights = 2;

  // The room being searched for, and how many of it. Required.
  //
  // SINGULAR. This was once a list, on the promise that several occupancies could be priced in one call —
  // two adults in one room and a family of four in another. The platform never delivered it: every
  // consumer read the FIRST entry and the room count came from the list's SIZE, so a second entry was
  // priced as though it did not exist while still moving the count that volume discounts and availability
  // key off. Ask for several identical rooms with `RoomConfiguration.quantity`; ask for several DIFFERENT
  // occupancies as separate calls, and assemble them in your own cart.
  RoomConfiguration room = 3;
}

// The occupancy of one room.
message RoomConfiguration {

  // Adults in this room. Defaults to 1.
  int32 adults = 1;

  // Children in this room, by age. Ages are REQUIRED, not optional detail: properties price children in
  // age bands, and an unpriceable age produces a rate the guest cannot actually book.
  repeated ChildOccupancy children = 2;

  // How many identical rooms of this configuration. Defaults to 1.
  int32 quantity = 3;
}

// A number of children of the same age.
message ChildOccupancy {

  // Age at check-in, in years. Zero is valid — infants are priced differently from older children, not
  // ignored.
  int32 age = 1;

  // How many children of this age. Defaults to 1.
  int32 quantity = 2;
}

// MAINTAINER NOTE — NOT PUBLISHED.
//
// RoomTypeOffers and RoomRate below are now reachable from the INVENTORY surface only; Search has its own
// SearchRoomTypeOffers/SearchRoomRate in partner_search.proto. By this file's own scope rule they could
// move to partner_inventory.proto. They are left here because the search pair is derived from them and
// the two sets have to be kept in step, which is easier to notice when one of them is the shared one.
// If a second surface ever needs them again, that is settled; if Inventory stays the only caller, moving
// them is a clean follow-up.

// The offers for one room type, with the room's own details carried once.
//
// This grouping mirrors the pricing engine's own shape (a room type holding its price configurations) and
// the way a rate table is actually rendered. It exists because `name` and `hero_image_url` describe the
// ROOM, not a rate: carried on RoomRate they were repeated across every rate x occupancy combination, which
// on the Inventory surface is the whole cross-product for the property.
message RoomTypeOffers {

  // The room type. Join to Content for the full gallery, amenities and long-form descriptions.
  string room_type_id = 1;

  // The room type's name, in the requested language where a translation exists.
  string name = 2;

  // A ready-to-use delivery URL for a single representative image of the room, scaled to 1024px wide
  // (Cloudinary's medium variant — c_scale, dpr_auto, f_auto, q_auto:best, w_1024). The lowest-sorted
  // published image; unset when the room has none.
  //
  // A plain URL rather than the full Multimedia object deliberately: this is a rates surface, not a
  // content surface, and shipping the full media object -- id, descriptions, every delivery-URL variant
  // -- for every room type on every rate response would make the payload about images instead of about
  // rates. The complete gallery is in Content.
  optional string hero_image_url = 3;

  // Every offer for this room, BOOKABLE FIRST and cheapest first within each group. On Search that is the
  // single best offer; on Inventory it is every rate and occupancy combination for the requested dates.
  //
  // Unavailable offers sort last, never first: they report 0 across all amounts, so ordering purely by
  // price would put "not priced" ahead of the cheapest real rate.
  repeated RoomRate rates = 4;

  // The property's own display order for its room types, ascending, when it has expressed one; 0 when it
  // has not. This describes the ROOM, which is why it is here rather than on each rate -- the domain
  // defines it as "how the room types should be sorted and displayed".
  //
  // It is a merchandising hint, not the delivered order: `room_types` is already ordered by price.
  int32 sort = 5;
}

// One priced, bookable offer for the itinerary.
//
// Everything here either is a price or changes which offer a traveller would choose. The prose behind the
// identifiers — rate plan names, perk descriptions, cancellation policy wording — lives in Content, reached
// via `room_rate_id`.
//
// HOW THE PRICE IS BUILT, and what each field means:
//
//   1. The property's price for the room over these dates, with occupancy surcharges (an extra adult, an
//      extra child), any single-occupancy reduction, and any rate PREMIUM already applied. That is
//      `unit_strikethrough_price` — the "was" price, for ONE room.
//   2. Discounts come off it: promotions, and your channel or membership terms. The result is
//      `unit_price` — the cost of ONE ROOM, everything applied. The "now" price.
//   3. Fixed charges attached to the rate plan are added — a one-time cleaning fee and the like. Never
//      discounted, so they are reported separately as `unit_extra_charges` rather than folded in.
//   4. Multiply by `quantity`, the number of identical rooms you asked for.
//
//   total = (unit_price + unit_extra_charges) x quantity
//
// WHY THE SURCHARGES SIT INSIDE THE STRIKETHROUGH. A strikethrough is a promise that the traveller is
// saving the difference, so the two prices must differ ONLY by things that are actually discounts. Put an
// extra-adult surcharge outside it and the "was" price falls BELOW the "now" price for any room with a
// third guest — which is why `unit_strikethrough_price >= unit_price` ALWAYS holds here, and why you can
// render the strikethrough unconditionally instead of testing which number is larger first.
//
// `discount_percent` is published rather than left to you, because there is exactly one correct rounding
// of it and three plausible ones. The absolute saving is deliberately NOT published: it is
// `unit_strikethrough_price - unit_price`, and a stored field that must always equal a subtraction is a
// field that can one day disagree with it.
//
// PER UNIT vs TOTAL. Fields prefixed `unit_` are for ONE room over the WHOLE stay. `total` is the only
// amount covering every room, and it is the number to charge. Nothing here is per NIGHT — divide by
// `room_nights` if you need a nightly figure, and expect it to be an average, since rates vary by date.
//
// MONEY CONVENTION. Every monetary field is an INTEGER IN MINOR UNITS of the response's `currency_code` —
// divide by 10^`currency_exponent` to get the real value. The currency and its exponent are stated once
// per response instead of on every amount, so amounts are directly comparable and directly addable with
// exact integer arithmetic and no rounding.
//
// The same vocabulary means the same things on the ancillary side — see `AncillaryOffer`.
message RoomRate {
  // Stable identifier for this offer, and the id you carry into a booking.
  //
  // This IS the master rate identifier — it maps from `roomRateIdentifier`, whose own schema calls it
  // "Specified master rate identifier". The name says `room_rate` for historical reasons and is kept rather
  // than duplicated: publishing a second `master_rate_id` field with the same value would be two
  // representations of one thing that can disagree, which this API forbids elsewhere for prices.
  string room_rate_id = 1;

  // The rate plan this offer sells under. Resolve it with Content's GetRatePlan; a rate plan is shared by
  // many offers, so it is referenced rather than repeated on each one.
  string rate_plan_id = 4;

  // True if THIS offer, at the requested occupancy, is bookable for the itinerary. Narrower than
  // `PropertySearchResult.available`, which is true when ANY offer at the property is. An unavailable offer is
  // still returned rather than dropped, so you can show the traveller why it cannot be booked.
  bool available = 3;

  // Check-in date, ISO-8601 "YYYY-MM-DD".
  string start_date = 5;

  // Check-out date, ISO-8601 "YYYY-MM-DD".
  string end_date = 6;

  // Nights covered by this rate.
  int32 room_nights = 7;

  // Adults the rate is priced for, after the property's occupancy policy is applied.
  int32 adults = 8;

  // Children the rate is priced for, after the property's occupancy policy is applied.
  int32 children = 9;

  // ONE room, whole stay, BEFORE discounts — step 1 above. The "was" price: render it struck through next
  // to `unit_price`.
  //
  // GUARANTEED >= `unit_price`. Occupancy surcharges and rate premiums are already inside it, so the gap
  // between the two is only ever the discounts. Equal to `unit_price` when nothing is discounted, in which
  // case show no strikethrough.
  int64 unit_strikethrough_price = 10;

  // ONE room, whole stay, after every adjustment — step 2 above. The "now" price, and the figure the
  // discount is measured against. Excludes the rate plan's fixed charges.
  //
  // Not named `net` or `source_total`: everywhere else in this platform "source" means the PROPERTY'S OWN
  // CURRENCY, and this figure is in the caller's. Reusing the word would have the next mapper author reach
  // for the domain's `getSourceTotal()` and quote the wrong currency.
  int64 unit_price = 11;

  // ONE room, whole stay — fixed charges attached to the rate plan, a one-time cleaning fee and the like.
  // Reported separately so a traveller sees them as their own line rather than as an unexplained
  // difference. NEVER discounted, which is why they sit outside both prices above. Zero when the rate plan
  // has none.
  int64 unit_extra_charges = 12;

  // What the guest pays for every room: `(unit_price + unit_extra_charges) x quantity`. This is the number
  // to show and the number to charge.
  //
  // Only meaningful when `available` is true. An unavailable offer reports 0 across every amount, which
  // means "not priced" rather than "free" — show the offer with its reason, never with a price of zero.
  int64 total = 13;

  // Meals included in the rate. These change which offer a traveller picks, so they are here rather than
  // behind an identifier.
  MealPlan meals = 14;

  // True if the stay can be cancelled without charge before the policy's deadline.
  bool refundable = 15;

  // How many days from TODAY the traveller has left to cancel free of charge, and -1 when the rate is not
  // refundable at all. Zero means the free-cancellation window closes today.
  //
  // Derived as (days until check-in) − (the policy's days-before-arrival deadline), floored at 0 — the same
  // calculation `RoomTypeBestPriceForDateRange` publishes. It is relative to the moment of the response and
  // will drift as the stay approaches, so treat it as display data, not something to cache.
  int32 refundable_until_days = 16;

  // Cancellation policy identifier. Join to Content for the full terms and wording.
  string cancellation_policy_id = 17;

  // Identifiers of the perks bundled with this rate. Join to Content for their names and descriptions.
  // There is deliberately no monetary "perk value" on this surface.
  repeated string perk_ids = 18;

  // Identifiers of the add-ons purchasable ALONGSIDE this offer, resolved against
  // `PropertyInventory.add_ons` in the same response — the same dictionary pattern as `perk_ids`.
  //
  // Add-ons hang off the OFFER, not the property: the pricing engine matches them per room configuration
  // (`RoomConfigurationPrice.addOnOffers`), so which add-ons are available genuinely differs between two
  // rates on the same room. Flattening them to a property-level list would discard that.
  //
  // INVENTORY ONLY, and only when you ask for it. Empty unless the request carried
  // `INVENTORY_SCOPE_ADD_ON`, and always empty on Search, which does not price add-ons at all.
  repeated string add_on_ids = 19;

  // How many identical rooms this offer is priced for — the `quantity` you set on the matching
  // `RoomConfiguration`. At least 1. What the PROPERTY has left is `rooms_left`, which is a different
  // number entirely.
  //
  // It is echoed back because it is a MULTIPLIER on `total`, not merely a restatement of your request:
  // without it you cannot tell whether `total` covers one room or five. It can also change the unit price
  // itself, since a property may attach a rate to a room-count range — book three and every room may be
  // cheaper than booking one.
  int32 quantity = 20;

  // The saving as a fraction of `unit_strikethrough_price` — 0.15 for 15%. Zero when nothing is
  // discounted.
  //
  // Published rather than left to you because there is one correct rounding of it and several plausible
  // ones, and a paid API where two integrators compute "18%" and "17%" from the same response is a support
  // burden rather than a saving. Quantity-invariant: discounting every room equally does not change the
  // percentage.
  double discount_percent = 21;

  // Every adjustment that moved this rate away from the property's plain price, one entry per kind, for
  // showing a traveller WHY the number is what it is. Empty when nothing applied.
  //
  // These reconcile exactly: the signed amounts sum to `unit_price` minus the property's unadjusted price.
  // They are per-unit, like the prices they explain.
  repeated PriceAdjustment adjustments = 22;

  // The property's own wording for the promotion or premium in force, in English plus your requested
  // language. Empty when neither applies.
  //
  // At the RATE level, not on each adjustment, because that is how the platform stores it — one list of
  // descriptions covering the special rates that fired. Attaching a label to each `PriceAdjustment` would
  // have meant publishing a field nothing could ever fill.
  repeated Description offer_details = 23;

  // Promotional codes that were actually ACCEPTED and are reflected in the price above — not the codes you
  // sent. A code your account is not entitled to is ignored rather than rejected, so comparing this against
  // what you submitted is how you tell which ones bit.
  repeated string promotional_codes = 24;

  // Extras sold with THIS rate — in-room ancillaries. Empty when the rate sells none.
  //
  // To book one, quote its `id` as BookingAncillaryRequest.offer_id and this rate's `room_rate_id` as
  // `inventory_id`. Unlike every other ancillary the inventory id is the RATE, because the gate for
  // these is keyed by the master rate rather than by an entity. Leave
  // BookingAncillaryRequest.channel_inventory_id blank — that is the common case and not an error.
  repeated AncillaryOffer room_type_ancillaries = 27;

  // How many rooms the property still has for the WHOLE stay — the "only 2 left" number.
  //
  // The SMALLEST nightly allotment across the stay, not the first night's and not an average. A three-night
  // stay whose middle night has two rooms free has two rooms left, however many are free either side: you
  // cannot sell a third room a guest would be evicted from on night two. The check-out date is excluded,
  // since nobody occupies a room that night.
  //
  // NOT the same as `quantity`, which is how many rooms YOU asked for. The relationship is
  // `rooms_left >= quantity` whenever `available` is true — an offer that cannot house the party you
  // requested is not bookable and says so. Reading `quantity` as "what the property has" overstates
  // availability, which is why they are named as differently as they are.
  //
  // Zero means none are free for these dates, and only ever appears alongside `available = false`. It is
  // a real answer, not a missing one.
  //
  // This is the property's true position, not a banded or capped figure. Treat it as commercially
  // sensitive: it is exact enough to reconstruct a property's booking curve if sampled over time.
  int32 rooms_left = 25;
}

// One reason this rate differs from the property's plain price.
//
// SIGNED, and the sign is the whole point: `unit_amount` is negative for anything that lowered the price
// and positive for anything that raised it, so a caller can render a list of lines and add them up without
// knowing which types are discounts. Amounts are per-unit minor units, matching the prices they explain.
//
// The surcharges and premiums here are already inside `unit_strikethrough_price`, and the discounts are
// the gap between it and `unit_price`. This message explains the arithmetic; it does not add to it.
message PriceAdjustment {

  // What kind of adjustment this is.
  AdjustmentType type = 1;

  // How much it moved the price for ONE room over the whole stay, in minor units. Negative lowered the
  // price, positive raised it. Never zero — an adjustment that changed nothing is not returned.
  int64 unit_amount = 2;
}

// The kinds of adjustment a rate can carry.
//
// Mirrors the pricing engine's own buckets one for one. There is deliberately no "other": a new bucket
// should appear here as its own member rather than being folded into a catch-all nobody can render.
enum AdjustmentType {

  // Not set; ignored.
  ADJUSTMENT_TYPE_UNSPECIFIED = 0;

  // Surcharge for adults beyond the rate's included occupancy. Raises the price.
  ADJUSTMENT_TYPE_EXTRA_ADULT = 1;

  // Surcharge for children beyond the rate's included occupancy. Raises the price.
  ADJUSTMENT_TYPE_EXTRA_CHILD = 2;

  // Reduction for a room occupied by a single guest. Lowers the price.
  ADJUSTMENT_TYPE_SINGLE_OCCUPANCY = 3;

  // A rate premium the property attached to these dates or conditions. Raises the price.
  ADJUSTMENT_TYPE_PREMIUM = 4;

  // A promotion or promotional code. Lowers the price. This is the bucket a room-count deal lands in — a
  // rate that only applies when you book three or more rooms is a promotion, not a separate kind.
  ADJUSTMENT_TYPE_PROMOTION = 5;

  // Your channel or membership terms. Lowers the price.
  ADJUSTMENT_TYPE_CHANNEL = 6;
}

// Which meals a rate includes.
message MealPlan {

  // Breakfast included.
  bool breakfast = 1;

  // Brunch included.
  bool brunch = 2;

  // Lunch included.
  bool lunch = 3;

  // Dinner included.
  bool dinner = 4;

  // All meals included.
  bool all_inclusive = 5;

  // All meals plus alcohol included.
  bool all_inclusive_plus_alcohol = 6;
}

// A perk bundled with a rate.
//
// Lives here rather than in partner_content.proto because the PRICING surfaces return a deduplicated
// dictionary of these alongside their rates: `RoomRate.perk_ids` would otherwise be unresolvable without a
// second call, and inlining the perk on every rate would repeat a handful of distinct perks across every
// rate of every room type of every property in a search result.
//
// `descriptions` carries the display name and body together — Description has both.
message PerkContent {

  // Stable perk identifier. Matches an entry in `RoomRate.perk_ids`.
  string id = 1;

  // Localized name and description, in English plus your requested language.
  repeated Description descriptions = 2;

  // Whether the perk is guaranteed rather than subject to availability.
  bool guaranteed = 3;

  // Perk tier; higher is more valuable.
  int32 level = 4;

  // Display order, ascending.
  int32 sort = 5;
}

// ---------------------------------------------------------------------------------------------------
// Ancillary vocabulary
//
// These live here rather than in partner_inventory.proto because RoomRate references AncillaryOffer for
// its room-type ancillaries, and partner_common imports nothing — every other partner proto imports IT.
// Moving them changes no fully-qualified name (they are all wink.partner.v1.*), so the wire and the
// published document are untouched; only the file they are declared in changed.
// ---------------------------------------------------------------------------------------------------

// Optional transactional sections of a property-inventory response.
//
// Every one of these prices something BOOKABLE. The names, descriptions, galleries, opening hours and
// addresses behind these identifiers are static content and come from the Content service — call it once
// per property and cache it. That split is the whole reason this surface stays small.
enum InventoryScope {

  // Not set; ignored.
  INVENTORY_SCOPE_UNSPECIFIED = 0;

  // Add-ons purchasable alongside a room offer. Populates `RoomRate.add_on_ids` and the
  // `PropertyInventory.add_ons` dictionary it resolves against.
  INVENTORY_SCOPE_ADD_ON = 1;

  // Bookable restaurant inventory — tables, sittings, set menus.
  INVENTORY_SCOPE_RESTAURANT = 2;

  // Bookable spa inventory — treatments and sessions.
  INVENTORY_SCOPE_SPA = 3;

  // Bookable meeting and event room inventory.
  INVENTORY_SCOPE_MEETING_ROOM = 4;

  // Bookable activities.
  INVENTORY_SCOPE_ACTIVITY = 5;

  // Bookable attractions.
  INVENTORY_SCOPE_ATTRACTION = 6;

  // Bookable places of interest.
  INVENTORY_SCOPE_PLACE = 7;

  // Property announcements for the requested stay. Not priced, but itinerary-dependent, which is why it
  // lives here rather than on Content: Content has no itinerary to resolve them against.
  INVENTORY_SCOPE_ANNOUNCEMENT = 8;

  // Extras sold with a ROOM RATE rather than by the property at large — the in-room ancillaries on
  // RoomRate.room_type_ancillaries.
  //
  // Its `inventory_id` on a booking is the RATE's id, not a room type and not an entity. That is the one
  // place this vocabulary is not entity-keyed, and getting it wrong produces an empty match rather than an
  // error, so read BookingAncillaryRequest before using it.
  INVENTORY_SCOPE_ROOM_TYPE_ANCILLARY = 9;
}

// One priced, bookable row of non-room inventory — a spa treatment, a table sitting, a tour departure.
//
// PRICES ARE PER UNIT, and there is no total. `RoomRate` can publish one because the room count is in your
// request; here the quantity is a choice the traveller has not made yet. An ancillary is quoted for ONE of
// whatever `pricing_type` says it is sold by, and YOU multiply. Publishing a "total" that assumed one unit
// — or assumed the whole party — would be a number that is wrong for most bookings but looks
// authoritative.
//
// HOW TO COMPUTE THE TOTAL. Take `unit_price`, then multiply by the quantity the traveller chooses and by
// whatever `pricing_type` says it repeats over:
//
//   PER_STAY, PER_USE                      total = unit_price x quantity
//   PER_NIGHT, PER_DAY                     total = unit_price x quantity x nights
//   PER_HOUR                               total = unit_price x quantity x hours
//   PER_PERSON, PER_ADULT, PER_CHILD       total = unit_price x that headcount
//   PER_PERSON_PER_NIGHT                   total = unit_price x headcount x nights
//   PER_ADULT_PER_NIGHT                    total = unit_price x adults x nights
//   PER_CHILD_PER_NIGHT                    total = unit_price x children x nights
//   PER_PERSON_PER_HOUR                    total = unit_price x headcount x hours
//   PER_ADULT_PER_HOUR                     total = unit_price x adults x hours
//   PER_CHILD_PER_HOUR                     total = unit_price x children x hours
//
// `nights` is the itinerary you asked to be priced; the occupancy is likewise yours to apply. Honour
// `min_pax`/`max_pax` before quoting: a row is not bookable outside them.
//
// MONEY. Minor units of the response's `currency_code`, exactly as on `RoomRate`, so ancillary and room
// amounts are addable without conversion.
message AncillaryOffer {

  // Stable identifier for this priced row. Distinct from `AncillaryInventory.inventory_id`: one
  // restaurant sells several sittings, and this identifies the sitting.
  string id = 1;

  // The row's name, as the property wrote it — "1 hour session", "Sunset departure". Untranslated;
  // the localized descriptions are on Content.
  string name = 2;

  // What one unit of `unit_price` buys, and therefore how to multiply it up. See the table above.
  PricingType pricing_type = 3;

  // Price of ONE unit BEFORE discounts — the "was" price. Show it struck through next to `unit_price`.
  //
  // GUARANTEED >= `unit_price`, exactly as on `RoomRate`, and equal to it when nothing is discounted.
  int64 unit_strikethrough_price = 4;

  // Price of ONE unit after the property's discount and your channel terms. This is the figure to
  // multiply up. Means the same thing `RoomRate.unit_price` means — the post-adjustment price of the thing
  // itself — and there is deliberately no `total` here, because the quantity is yours to choose.
  int64 unit_price = 5;

  // Smallest party this row can be booked for; 0 when the property set no minimum.
  int32 min_pax = 6;

  // Largest party this row can be booked for; 0 when the property set no maximum.
  int32 max_pax = 7;

  // Promotional code that produced the discount, when one did. Empty when the price is simply the
  // property's own discounted rate.
  string promotion = 8;

  // The saving as a fraction of `unit_strikethrough_price` — 0.15 for 15%. Zero when nothing is
  // discounted. Same definition and the same reason for existing as `RoomRate.discount_percent`.
  //
  // Quantity-invariant, which is what makes it safe here even though this message has no total: the
  // percentage a traveller sees does not change with how many they buy.
  double discount_percent = 9;
}

// How a non-room item is sold, and therefore how to multiply `AncillaryOffer.unit_price` up to a total.
//
// Mirrors the platform's own pricing granularities one-for-one. Several combinations the names suggest
// (per person per stay, per adult per use) do not exist because the platform does not offer them.
enum PricingType {

  // Not set; ignored. Treat a row carrying this as sold per stay.
  PRICING_TYPE_UNSPECIFIED = 0;

  // Priced once for the entire stay.
  PRICING_TYPE_PER_STAY = 1;

  // Priced per day.
  PRICING_TYPE_PER_DAY = 2;

  // Priced per night.
  PRICING_TYPE_PER_NIGHT = 3;

  // Priced per use or visit.
  PRICING_TYPE_PER_USE = 4;

  // Priced per hour.
  PRICING_TYPE_PER_HOUR = 5;

  // Priced per person.
  PRICING_TYPE_PER_PERSON = 6;

  // Priced per person, per night.
  PRICING_TYPE_PER_PERSON_PER_NIGHT = 7;

  // Priced per person, per hour.
  PRICING_TYPE_PER_PERSON_PER_HOUR = 8;

  // Priced per adult.
  PRICING_TYPE_PER_ADULT = 9;

  // Priced per adult, per night.
  PRICING_TYPE_PER_ADULT_PER_NIGHT = 10;

  // Priced per adult, per hour.
  PRICING_TYPE_PER_ADULT_PER_HOUR = 11;

  // Priced per child.
  PRICING_TYPE_PER_CHILD = 12;

  // Priced per child, per night.
  PRICING_TYPE_PER_CHILD_PER_NIGHT = 13;

  // Priced per child, per hour.
  PRICING_TYPE_PER_CHILD_PER_HOUR = 14;
}

// Direction to sort a result set in.
//
// Shared by every paged surface on this API, so one ordering vocabulary covers them all.
enum SortDirection {

  // Never sent by the server; treated as ascending on a request.
  SORT_DIRECTION_UNSPECIFIED = 0;

  // Ascending.
  SORT_DIRECTION_ASC = 1;

  // Descending.
  SORT_DIRECTION_DESC = 2;
}
