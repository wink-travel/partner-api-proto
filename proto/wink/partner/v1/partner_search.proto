option java_package = "travel.wink.grpc.v1";
option java_multiple_files = true;
option java_outer_classname = "PartnerSearchProto";

// MAINTAINER NOTES — NOT PUBLISHED.
//
// Separated from the next declaration by a BLANK LINE so protoc classifies this as
// `leading_detached_comments`; GrpcOpenApiGenerator reads only `leading_comments`.
//
// Replaced the REST PartnerInventorySearchController (deleted at the gRPC cutover):
//   SearchByGeo    <- POST /api/partner/{id}/search/geo            (MapRequest)
//   SearchByCity   <- POST /api/partner/{id}/search/city           (CitySearchRequest)
//   RankByAgency   <- POST /api/partner/{id}/ranked/search/agency  (AgencyScoreRequest)
//   RankByCity     <- POST /api/partner/{id}/ranked/search/city    (CityScoreRequest)
//   RankByCountry  <- POST /api/partner/{id}/ranked/search/country (CountryScoreRequest)
//   RankGlobal     <- POST /api/partner/{id}/ranked/search/global  (GlobalScoreRequest)
//
// The billable account is NOT a request field — it arrives as call metadata under
// `managing-entity-id` and is read via GrpcPartnerCallContext.requireAccount(). No Partner request
// message may declare it; PartnerRequestConventionTest asserts that absence. See the maintainer notes in
// partner_destination_lookup.proto for why the account moved off the payload.
//
// TAG NUMBERING. Nothing consumes this contract yet — not production, which still serves the pre-gRPC
// servlet app, and not staging either: it runs the gRPC service, but nothing outside this repo has a
// generated client pointed at it. So a removed field's tag is reused directly rather than left `reserved`
// -- there is no existing decoder anywhere that a recycled tag could feed garbage to. This is a standing
// policy, not a one-off judgement call: it holds for every edit on this surface until something outside
// this repo actually depends on it, at which point `reserved` becomes mandatory and this note should say
// so.
//
// SearchRoomRate's `reserved 19, 27` is the one exception, and it is NOT this policy: it exists to keep
// SearchRoomRate diffable against the sibling RoomRate message, which still legitimately uses those tags
// for different fields (see SearchRoomRateParityTest and the note on SearchRoomRate itself), not because
// any external decoder depends on it.
//
// METERED SURFACE. Do NOT call PartnerGrpcUsageGuard from PartnerSearchGrpcService — that guard is
// free-surface-only. Billing happens because PartnerSearchServiceImpl's six methods carry
// `@Metered(MeterStrategy.SEARCH)`; that annotation MUST stay on a Page-returning method or the cost
// silently collapses to the one-unit floor (the #709 regression).
//
// WHY `SearchByCityRequest.city` AND `RankByCityRequest.city` ARE ONEOFS, NOT ONE STRING. City search
// used to take a bare identifier and match it `$or: [{cityGeoNameId: X}, {cityUrlName: X}]`. Measured on
// production, that degraded into a post-FETCH residual filter — an `$or` can only use an index on every
// branch, so the most selective predicate in the whole query (roughly 1/634 of the collection) stopped
// being one, and ~90% of the documents pulled off disk were discarded. `travel.wink.inventory.api.CityKey`
// exists to make that mistake structurally impossible: the caller states which form it holds, and exactly
// one indexed match runs. The oneof here is that same discipline reaching the wire — see
// PartnerSearchProtoMapper.toCitySearchRequest and toCityScoreRequest for where a request becomes a
// CityKey, and `travel.wink.computed.api.property.CitySearchRequest`/`CityScoreRequest` (the shared
// REST/domain request types) for why THEY stay permissive: those are also a published REST request body
// with real callers, so they accept both fields and resolve a precedence rather than rejecting a caller
// who defensively sends both. The gRPC surface has no such history, so it enforces exactly-one
// structurally instead.
//
// ── THE DESIGN DECISION THIS FILE ENCODES ───────────────────────────────────────────────────────────
//
// A pricing endpoint returns PRICES. Static content — property descriptions, addresses, galleries, room
// detail, amenities, policies, rate plan and perk prose — is served exclusively by `service Content` and
// appears NOWHERE on this surface.
//
// There is deliberately NO opt-in to inline static content. An `expand`-style mechanism was designed for
// the Partner API in #668 and is NOT revived here, because two sources for the same static data means two
// versions that can disagree within a single response. One source, one version. That is the whole point.
//
// `last_update` on every result is what makes the split workable. Cache Content keyed on property_id, compare
// the timestamp on each search, re-fetch only when it moves. Without it a thin row would force either
// constant re-fetching or stale names. It is the aggregate's own lastUpdate rather than a synthetic
// opaque token: same job, and an integrator can also show "updated 3 days ago" with it.
//
// Rate-attached data splits on DECISION vs PROSE. Fields that change which offer a traveller would pick
// stay inline — meal-inclusion booleans, `refundable`, the money. The localized names and descriptions
// behind them move to Content, reachable through the identifiers carried here (`room_rate_id`,
// `perk_ids`, `cancellation_policy_id`). You can rank and choose without a second call; you need Content
// only to render prose.
//
// `rate_plan_id`, `room_type_id` and `channel_inventory_id` were dropped, and RoomPrice was folded into
// RoomRate. The rate plan is an embedded object on the master rate, so `room_rate_id` already reaches it;
// the wrapper message added a level of nesting that carried one identifier and nothing else.
//
// That split is also why no monetary perk value is published. The domain's `perkValue` is a sum of
// internal tier levels, not an amount, and dressing it up as money on a paid wire would have integrators
// adding it to totals. The perk-ranked sort went with it — see ScoreSort.
//
// Measured baseline for reference: the REST twin serializes ~1,186 lines per result under
// Views.Non_Authenticated_Entity (PartnerSearchContractMeasurementTest, 2026-08-07). Everything removed here
// is retrievable from Content, so nothing is lost — only relocated.
//
// MONEY is minor-unit int64 plus a page-level currency and exponent, NOT google.type.Money. Money would
// repeat currency_code on four fields per offer on every result -- pure redundancy once the page declares
// one display currency. What must NOT be lost in that trade is the EXPONENT: NumberUtils lists JPY/KRW/VND/
// CLP/ISK among this platform's currencies, so a fixed divide-by-100 is wrong for real inventory. Publish
// currency_exponent; never assume 2.

// Search Wink's bookable property inventory and get live prices — the paid Partner Search API.
//
// Six ways to find properties: by map position, by city, or ranked by agency, city, country or globally.
// All six return the same page shape, so one result renderer serves every entry point.
//
// These endpoints return PRICES, not property content. Each result carries just enough to render a list row
// — name, location, star rating, one image — plus the prices themselves. Descriptions, galleries, addresses,
// room detail, amenities and policies come from the Content service, which you should cache per property and
// refresh when `last_update` changes. That split keeps search responses small and fast, and it means
// property content has exactly one source of truth.
//
// Every call needs an authenticated token with `INVENTORY:READ` on the account you pass, and is billed in
// hotel-day units: (properties actually returned) x min(itinerary nights, 90). You are charged for what comes
// back, not for what you asked for — a request for 50 results that matches 3 properties bills 3 properties.
//
// Prices are live and are not cached. Treat a result as valid for the length of a user's session.
service Search {

  // Search by map position
  //
  // Find properties inside a search area. Set `area` to a point for "near here", a polygon for "everything
  // in this viewport", or a multi-polygon for several disjoint regions at once.
  //
  // A point search is ordered nearest first and reports `distance_in_meters` on every result. Polygon and
  // multi-polygon searches are containment tests with no distance and no distance ordering.
  //
  // Returns INVALID_ARGUMENT if `area` is unset, if its geometry is malformed, or if you pass
  // `radius_in_meters` with anything other than a point.
  rpc SearchByGeo (SearchByGeoRequest) returns (SearchByGeoResponse) {}

  // Search by city
  //
  // Find available properties in or around a city, identified by either its GeoNames id or its url name --
  // both are on the same `City` message the Lookup service and every pricing/content result return, so you
  // never need a lookup round trip just to convert one identifier to the other.
  //
  // Returns INVALID_ARGUMENT if you send neither.
  rpc SearchByCity (SearchByCityRequest) returns (SearchByCityResponse) {}

  // Rank YOUR OWN managed properties
  //
  // Return the properties in your own managed portfolio, ordered by the scoring type you choose --
  // "your own" meaning the account you called with (`managing-entity-id`), not a request field: this is
  // the one Search RPC with no identifier for WHICH agency, because the account making the call IS the
  // agency. Typical callers are a management company or hotel chain (`ManagingEntityType.MANAGEMENT_COMPANY`
  // or `CHAIN`) that operates properties on behalf of their owners and calls the Partner API with its own
  // credentials to see everything it represents.
  //
  // This is why it is the one ranked call with no `search_filters`: it is not a marketplace search, it is
  // a listing of what you already manage, so filters like star rating or lifestyle would be filtering your
  // own portfolio rather than discovering new inventory. Optionally narrow it to one city or country with
  // `scope`; omit it to rank everything you manage.
  rpc RankByAgency (RankByAgencyRequest) returns (RankByAgencyResponse) {}

  // Rank a city's properties
  //
  // Return properties in or around a city, identified by either its url name or its GeoNames id, ordered
  // by the scoring type you choose.
  //
  // Returns INVALID_ARGUMENT if you send neither.
  rpc RankByCity (RankByCityRequest) returns (RankByCityResponse) {}

  // Rank a country's properties
  //
  // Return properties within a country, ordered by the scoring type you choose.
  rpc RankByCountry (RankByCountryRequest) returns (RankByCountryResponse) {}

  // Rank properties worldwide
  //
  // Return the best-scoring properties across the whole platform. Use this for editorial and discovery
  // surfaces rather than for a destination search.
  rpc RankGlobal (RankGlobalRequest) returns (RankGlobalResponse) {}
}

// ---------------------------------------------------------------------------------------------------
// Requests
// ---------------------------------------------------------------------------------------------------

// Request for SearchByGeo.
message SearchByGeoRequest {

  // Traveller context: dates, occupancy, language and currency. Required.
  UserSession user_session = 1;

  // Where to search. Required. A point, a polygon, or a multi-polygon — see GeoShape.
  //
  // The geometry you choose decides how the search behaves: a point searches outward to
  // `radius_in_meters` and orders results nearest first; a polygon or multi-polygon tests containment,
  // takes no radius, and has no distance to order by.
  GeoShape area = 2;

  // How far to search from a point, in metres. Only valid when `area` holds a point; sending it with a
  // polygon is rejected with INVALID_ARGUMENT rather than ignored, because a silently dropped radius
  // returns a plausible page that is not the search you asked for. Defaults to 1000 when omitted.
  int64 radius_in_meters = 3;

  // Optional narrowing of the result set.
  SearchFilters search_filters = 4;

  // Zero-based page number. Defaults to 0.
  int32 page = 5;

  // Results per page. Defaults to 20, which is also the maximum. A larger value is rejected with
  // INVALID_ARGUMENT rather than clamped, so a caller never pages through a result set believing it is
  // larger than it is. Every property returned is billed, so the cap bounds cost as well as fan-out.
  int32 size = 6;

  // IANA media type for image delivery URLs: image/jpeg (the default), image/png, image/webp, or image/*
  // to let the CDN negotiate per client from its Accept header. Empty means image/jpeg.
  //
  // An unrecognised value is rejected with INVALID_ARGUMENT rather than quietly falling back, so a typo
  // like "image/jpg" (not a media type) fails loudly instead of serving you JPEG while you believe you
  // asked for something else. Whatever is served is echoed back on `MediaUrlVariant.format`.
  string image_format = 7;
}

// Response for SearchByGeo.
message SearchByGeoResponse {

  PropertyPage page = 1;

  // ISO 4217 currency EVERY amount in this response is denominated in — the one you asked for in
  // `user_session.currency_code`, or the property's own when you asked for none. Stated once here rather than
  // repeated on every amount, which is why the amounts themselves are bare integers.
  string currency_code = 2;

  // How many decimal places `currency_code` has: 2 for THB and USD, 0 for JPY, KRW and VND.
  //
  // Amounts are integers in MINOR UNITS, so the real value is `amount / 10^currency_exponent`. This is
  // published rather than assumed because a fixed divide-by-100 is wrong for a real slice of Wink's
  // inventory — a JPY stay priced at 15000 is ¥15,000, not ¥150.
  int32 currency_exponent = 3;

  // ISO 639-1 language the names and other text in this response are in — the one you asked for in
  // `user_session.language_code`, or English when it was unavailable.
  string language_code = 4;
}

// Request for SearchByCity.
message SearchByCityRequest {

  // Traveller context. Required.
  UserSession user_session = 1;

  // Which city to search, identified either by its GeoNames id or its url name. Exactly one of these must
  // be set -- both name the same city, so it is never useful to send both, and the query runs a single
  // indexed match on whichever one you send. See the maintainer note near the top of this file for why
  // this is not an `$or` across both.
  oneof city {

    // GeoNames id of the city, as returned by the Lookup service or `City.geo_name_id` on a
    // pricing/content result.
    string geo_name_id = 2;

    // Url-safe city slug, as returned by the Lookup service or `City.url_name` on a pricing/content
    // result. NOTE: `City.url_name` is empty for roughly a fifth of properties -- check it is set before
    // relying on it.
    string url_name = 7;
  }

  // Optional narrowing of the result set.
  SearchFilters search_filters = 3;

  // Zero-based page number. Defaults to 0.
  int32 page = 4;

  // Results per page. Defaults to 20, which is also the maximum. A larger value is rejected with
  // INVALID_ARGUMENT rather than clamped, so a caller never pages through a result set believing it is
  // larger than it is. Every property returned is billed, so the cap bounds cost as well as fan-out.
  int32 size = 5;

  // IANA media type for image delivery URLs: image/jpeg (the default), image/png, image/webp, or image/*
  // to let the CDN negotiate per client from its Accept header. Empty means image/jpeg.
  //
  // An unrecognised value is rejected with INVALID_ARGUMENT rather than quietly falling back, so a typo
  // like "image/jpg" (not a media type) fails loudly instead of serving you JPEG while you believe you
  // asked for something else. Whatever is served is echoed back on `MediaUrlVariant.format`.
  string image_format = 6;
}

