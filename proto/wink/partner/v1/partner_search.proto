  oneof scope {

    // GeoNames id of the city, as returned by the Lookup service or `City.geo_name_id` on a
    // pricing/content result.
    string city_geo_name_id = 2;

    // Url-safe city slug, as returned by the Lookup service or `City.url_name` on a pricing/content
    // result.
    string city_url_name = 7;

    // ISO 3166-1 alpha-2 country code, e.g. "TH".
    string country_code = 8;
  }

  // How to order the results.
  ScoreSort sort = 3;

  // Zero-based page number. Defaults to 0.
  int32 page = 4;

  // Results per page. Defaults to 20, which is also the maximum. A larger value is rejected with
