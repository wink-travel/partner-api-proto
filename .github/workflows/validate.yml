name: validate

# Runs on PRs to this repo — which should only ever touch docs/CI, since proto files are
# machine-published by monorepo-java's release pipeline (see CONTRIBUTING.md). Still worth linting
# so a stray manual edit doesn't silently drift from the WIRE_JSON breaking policy documented in
# buf.yaml.

on:
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  buf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history + tags: the breaking check below resolves the previous release tag out of
          # the local clone (.git#tag=...), so a shallow checkout would leave it nothing to compare
          # against.
          fetch-depth: 0

      - uses: bufbuild/buf-setup-action@v1

      - name: buf lint
        run: buf lint

      - name: buf breaking (against previous release tag)
        run: |
          set -euo pipefail
          PREV_TAG=$(git describe --tags --abbrev=0 --match 'v*')
          echo "Comparing against ${PREV_TAG}."
          buf breaking --against ".git#tag=${PREV_TAG}"
